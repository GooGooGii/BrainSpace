<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#7591bf" />
    <meta name="description" content="用手指畫出有重量的物件，解開撞牆、入杯、槓桿與齒輪挑戰的物理解謎遊戲。" />
    <title>腦洞物理室</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>.win-stars{margin-bottom:6px;color:#a85b00;font-size:2rem;letter-spacing:.12em;text-shadow:0 2px 0 rgba(255,255,255,.45)}.card-stars{color:#ffd166;letter-spacing:.04em}.chapter-heading{grid-column:1/-1;display:flex;align-items:end;justify-content:space-between;margin:14px 2px 0;padding-bottom:7px;border-bottom:2px solid rgba(255,255,255,.22);color:#fff;font-size:1.05rem}.chapter-heading small{color:#dce7f7;font-size:.72rem;font-weight:700;letter-spacing:.08em}</style>
  </head>
  <body>
    <section id="levelSelect" class="level-select">
      <header class="select-header">
        <p>腦洞物理室</p>
        <h1>選擇關卡</h1>
        <span id="progressText">已解鎖 1 / 62　★ 0 / 186</span>
      </header>
      <div id="levelGrid" class="level-grid" aria-label="關卡選擇"></div>
      <p class="select-tip">完成關卡即可解鎖下一題，每一題都有不只一種解法。</p>
    </section>
    <main id="gameApp" class="game-app hidden">
      <header class="hud">
        <button id="levelMenuButton" class="level-badge" aria-label="返回選關">01</button>
        <div class="mission"><span class="orange-dot" aria-hidden="true"></span><h1 id="missionText">把球放在橘色盒子裡</h1></div>
        <button id="hintButton" class="round-button" aria-label="提示">💡</button>
      </header>
      <section class="status-row" aria-label="遊戲狀態">
        <div class="status-item"><span>⏱</span><strong id="timer">0.0</strong><small>秒</small></div>
        <div class="status-item"><span>✎</span><strong id="strokeCount">0 / 3</strong><small>畫線</small></div>
        <p id="instruction">畫第一筆，放開後物理立即開始</p>
      </section>
      <section id="gameBoard" class="game-board" aria-label="物理解謎遊戲區">
        <div id="canvasMount" class="canvas-mount"></div>
        <div id="resultBanner" class="result-banner" aria-live="polite"></div>
      </section>
      <footer class="controls">
        <button id="undoButton" class="control-button secondary" disabled><span>↶</span>上一步</button>
        <button id="dropButton" class="control-button primary" disabled><span>↓</span>自動落下</button>
        <button id="resetButton" class="control-button secondary"><span>↻</span>重新開始</button>
      </footer>
    </main>
    <dialog id="hintDialog" class="hint-dialog">
      <button id="closeHint" class="dialog-close" aria-label="關閉">×</button>
      <div class="hint-icon">💡</div><h2 id="hintTitle">線條也有重量</h2>
      <p id="hintBody">放開第一筆時，球和線會一起開始掉落。利用障礙物與牆壁改變它們的方向。</p>
      <button id="gotItButton">知道了</button>
    </dialog>
    <script defer src="./game.bundle.js"></script>
  </body>
</html>
