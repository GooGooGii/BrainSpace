<html lang="zh-Hant">

    <meta name="theme-color" content="#7591bf" />
    <meta name="description" content="用手指畫出路線，讓橘球落進橘色盒子的 three.js 物理解謎遊戲。" />
    <title>腦洞物理室</title>
    <style>:root{color-scheme:light;font-family:"Arial Rounded MT Bold","PingFang TC","Noto Sans TC",system-ui,sans-serif;--blue:#7895c5;--board:#263b4b;--ink:#152535;--orange:#ff9f1c;--cream:#f7f3e9}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow:hidden}body{min-height:100dvh;color:#fff;background-color:var(--blue);background-image:radial-gradient(circle at 20% 10%,rgba(255,255,255,.12) 0 2px,transparent 3px),radial-gradient(circle at 70% 65%,rgba(32,54,87,.08) 0 3px,transparent 4px);background-size:36px 36px,49px 49px;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}button{font:inherit}.game-app{width:min(100%,620px);height:100dvh;margin:auto;padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:8px}.hud{display:grid;grid-template-columns:52px 1fr 52px;gap:10px;align-items:center}.level-badge,.round-button{height:52px;border:2px solid #102235;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(#455d78,#273b51);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),0 3px 0 rgba(16,34,53,.6);font-size:1.25rem;font-weight:900}.round-button{border-radius:50%;cursor:pointer}.mission{min-width:0;display:flex;justify-content:center;align-items:center;gap:9px}.mission h1{margin:0;font-size:clamp(1rem,4.5vw,1.35rem);line-height:1.2;text-align:center;text-shadow:0 2px 0 rgba(0,0,0,.22)}.orange-dot{flex:0 0 auto;width:16px;height:16px;border-radius:50%;background:var(--orange);box-shadow:0 2px 0 #bd6800}.status-row{min-height:42px;display:flex;align-items:center;gap:10px;padding:0 4px}.status-item{min-width:72px;display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;column-gap:5px;align-items:center}.status-item>span{grid-row:1/3;font-size:1.35rem}.status-item strong{font-size:.95rem;line-height:1}.status-item small{opacity:.75;font-size:.68rem}#instruction{margin:0 0 0 auto;color:rgba(255,255,2   <body>
    <main class="game-app">
      <header class="hud">
        <div class="level-badge" aria-label="目前關卡">01</div>
        <div class="mission"><span class="orange-dot" aria-hidden="true"></span><h1>把球放在橘色盒子裡</h1></div>
        <button id="hintButton" class="round-button" aria-label="提示">💡</button>
      </header>
      <section class="status-row" aria-label="遊戲狀態">
        <div class="status-item"><span>⏱</span><strong id="timer">0.0</strong><small>秒</small></div>
        <div class="status-item"><span>✎</span><strong id="strokeCount">0 / 3</strong><small>畫線</small></div>
        <p id="instruction">畫第一筆，放開後物理立即開始</p>
      </section>
      <section id="gameBoard" class="game-board" aria-label="物理解謎遊戲區">
        <div id="canvasMount" class="canvas-mount"></div>
        <div id="resultBanner" class="result-banner" aria-live="polite"></div>
      </section>
      <footer class="controls">
        <button id="undoButton" class="control-button secondary" disabled><span>↶</span>上一步</button>
        <button id="dropButton" class="control-button primary" disabled><span>↓</span>自動落下</button>
        <button id="resetButton" class="control-button secondary"><span>↻</span>重新開始</button>
      </footer>
    </main>
    <dialog id="hintDialog" class="hint-dialog">
      <button id="closeHint" class="dialog-close" aria-label="關閉">×</button>
      <div class="hint-icon">💡</div><h2>線條也有重量</h2>
      <p>放開第一筆時，球和線會一起開始掉落。利用障礙物與牆壁改變它們的方向。</p>
      <button id="gotItButton">知道了</button>
    </dialog>
